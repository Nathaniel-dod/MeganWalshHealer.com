openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /enquiries:
    post:
      operationId: createEnquiry
      summary: Save a general practitioner enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry saved (no email notification is sent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          description: Invalid enquiry
        "429":
          description: Too many requests
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    EnquiryInput:
      type: object
      required: [name, email, service, message, consent]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        service:
          type: string
          enum: [CellSonic Regeneration, Wolfe Non Surgical, Perfect Day Consults, Reiki Healing, Palm Readings, Intuitive Tarot Readings, Mediumship Readings, Ordained Ministry, General enquiry]
        message:
          type: string
          minLength: 1
          maxLength: 3000
        consent:
          type: boolean
          enum: [true]
    EnquiryReceipt:
      type: object
      required: [id, message]
      properties:
        id:
          type: integer
        message:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

